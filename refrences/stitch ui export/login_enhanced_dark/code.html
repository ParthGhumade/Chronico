<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chronico - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#131313",
                    "inverse-surface": "#e5e2e1",
                    "on-tertiary-fixed": "#2f1400",
                    "surface-tint": "#adc6ff",
                    "surface-container-high": "#2a2a2a",
                    "surface-variant": "#353534",
                    "outline-variant": "#424753",
                    "background": "#131313",
                    "secondary-fixed": "#dde3e9",
                    "tertiary-fixed-dim": "#ffb780",
                    "tertiary-fixed": "#ffdcc4",
                    "tertiary": "#ffb780",
                    "on-primary": "#002e69",
                    "inverse-on-surface": "#313030",
                    "on-tertiary": "#4e2600",
                    "error": "#ffb4ab",
                    "on-primary-fixed": "#001a41",
                    "on-primary-fixed-variant": "#004494",
                    "on-surface": "#e5e2e1",
                    "secondary-fixed-dim": "#c1c7cd",
                    "on-error": "#690005",
                    "on-secondary": "#2b3136",
                    "secondary": "#c1c7cd",
                    "surface-container-lowest": "#0e0e0e",
                    "inverse-primary": "#005ac1",
                    "primary": "#adc6ff",
                    "primary-fixed": "#d8e2ff",
                    "on-primary-container": "#00285c",
                    "on-surface-variant": "#c2c6d5",
                    "surface-container": "#201f1f",
                    "on-secondary-container": "#b0b6bc",
                    "secondary-container": "#41474d",
                    "primary-container": "#4d8efe",
                    "surface-dim": "#131313",
                    "surface-container-low": "#1c1b1b",
                    "on-tertiary-container": "#442000",
                    "primary-fixed-dim": "#adc6ff",
                    "surface-bright": "#393939",
                    "on-secondary-fixed": "#161c21",
                    "outline": "#8c909f",
                    "on-background": "#e5e2e1",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#6f3800",
                    "error-container": "#93000a",
                    "surface-container-highest": "#353534",
                    "on-secondary-fixed-variant": "#41474d",
                    "tertiary-container": "#db760f"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "margin-desktop": "32px",
                    "gutter": "24px",
                    "sm": "12px",
                    "xl": "64px",
                    "md": "24px",
                    "lg": "40px",
                    "base": "8px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "display": ["Playfair Display", "serif"],
                    "headline-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],

          }
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container relative">
<!-- Decorative background pattern for the whole screen -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(#adc6ff 1px, transparent 1px); background-size: 32px 32px;"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 transition-colors border-b border-outline-variant/10">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center border border-primary/20 shadow-[0_0_15px_rgba(173,198,255,0.15)]">
<span class="material-symbols-outlined text-primary text-xl">school</span>
</div>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-md md:text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">Chronico</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-16 px-margin-mobile md:px-margin-desktop pb-20 z-10">
<div class="w-full max-w-md flex flex-col gap-8 p-10 rounded-2xl border border-outline-variant/30 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.5)] relative overflow-hidden group bg-gradient-to-br from-surface-container-low to-surface-container">
<!-- Subtle ambient glow effect behind the card content -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-primary/15 rounded-full blur-[80px] opacity-60 pointer-events-none"></div>
<div class="absolute -bottom-32 -left-32 w-64 h-64 bg-tertiary/10 rounded-full blur-[80px] opacity-40 pointer-events-none"></div>
<div class="text-center z-10 pt-4">
<h1 class="font-display text-display text-on-background mb-3 italic">Login</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back to Chronico</p>
</div>
<form class="flex flex-col gap-6 z-10 mt-2" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2 relative">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative group/input">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant/50 group-focus-within/input:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3.5 text-on-background font-body-md text-body-md focus:border-primary focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all placeholder:text-on-surface-variant/40 hover:border-outline-variant shadow-inner" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2 relative">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
</div>
<div class="relative group/input">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant/50 group-focus-within/input:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant/50 rounded-xl pl-12 pr-4 py-3.5 text-on-background font-body-md text-body-md focus:border-primary focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all placeholder:text-on-surface-variant/40 hover:border-outline-variant shadow-inner" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="mt-6 w-full bg-primary hover:bg-primary-fixed-dim text-on-primary font-label-md text-label-md py-3.5 px-6 rounded-xl transition-all active:scale-[0.98] shadow-[0_0_20px_rgba(173,198,255,0.25)] hover:shadow-[0_0_25px_rgba(173,198,255,0.4)] flex justify-center items-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="text-center mt-2 z-10 pb-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary hover:text-primary-fixed-dim font-label-md transition-colors underline-offset-4 hover:underline ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
</main>
<!-- Bottom Nav Suppressed (Transactional Page) -->
</body></html>
