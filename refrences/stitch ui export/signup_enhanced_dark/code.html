<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container relative overflow-hidden">
<!-- Subtle light leak effect -->
<div class="absolute top-0 right-0 w-96 h-96 bg-primary opacity-10 rounded-full blur-[100px] pointer-events-none -translate-y-1/2 translate-x-1/3"></div>
<div class="absolute bottom-0 left-0 w-80 h-80 bg-tertiary-container opacity-10 rounded-full blur-[120px] pointer-events-none translate-y-1/3 -translate-x-1/3"></div>
<!-- Top App Bar -->
<header class="bg-transparent text-primary font-title-md text-title-md full-width top-0 flat no shadows text-on-surface-variant flex justify-between items-center px-margin-desktop md:px-margin-desktop px-margin-mobile w-full h-16 sticky z-50">
<div class="flex items-center gap-md">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">Chronico</span>
</div>
<div>
<!-- Suppressed trailing icon for transactional screen -->
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative z-10">
<div class="w-full max-w-md bg-surface-container/60 backdrop-blur-xl border border-white/5 shadow-2xl rounded-2xl p-lg md:p-xl flex flex-col gap-xl">
<div class="text-center">
<h1 class="text-4xl md:text-5xl font-extrabold text-white mb-sm tracking-tighter">Create Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Join Chronico to get started.</p>
</div>
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email</label>
<input class="w-full bg-surface-container-high/80 border border-outline/30 rounded-xl px-md py-3 font-body-md text-body-md text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all duration-200 placeholder:text-outline/50 shadow-inner" id="email" placeholder="name@example.com" type="email">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Password</label>
<input class="w-full bg-surface-container-high/80 border border-outline/30 rounded-xl px-md py-3 font-body-md text-body-md text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all duration-200 placeholder:text-outline/50 shadow-inner" id="password" placeholder="••••••••" type="password">
</div><div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="confirm-password">Confirm Password</label>
<input class="w-full bg-surface-container-high/80 border border-outline/30 rounded-xl px-md py-3 font-body-md text-body-md text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all duration-200 placeholder:text-outline/50 shadow-inner" id="confirm-password" placeholder="••••••••" type="password">
</div>
<button class="w-full bg-gradient-to-r from-primary-container to-inverse-primary text-white font-label-md text-label-md py-3.5 rounded-xl mt-sm hover:opacity-90 hover:shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all duration-300 shadow-md border border-white/10 font-semibold" type="button">
                    Sign Up
                </button>
</form>

</div>
